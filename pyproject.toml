[project]
name = "agentic-ai-mastery"
version = "0.1.0"
description = "Comprehensive implementations, live projects, and design patterns for Agentic AI from Foundations to Enterprise Multi-Agent Systems."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.20",
    "langsmith>=0.1.120",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.1",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
    "deepeval>=1.0.0",
    "guardrails-ai>=0.5.0",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "streamlit>=1.38.0",
    "rich>=13.8.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "week-*", "weeks-*"]
